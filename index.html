<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drive Playlist</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main class="app">
    <header>
      <h1>Drive Playlist</h1>
      <p>Stream a Google Drive folder as a video playlist.</p>
    </header>

    <section class="player-card">
      <video id="player" controls playsinline></video>
      <h2 id="nowPlaying">Nothing loaded yet</h2>
      <p id="status">Connect to Google Drive, then paste your folder link.</p>

      <div class="controls">
        <button id="prevBtn">⏮ Previous</button>
        <button id="nextBtn">Next ⏭</button>
      </div>

      <div class="controls">
        <button id="shuffleBtn">Shuffle: Off</button>
        <button id="repeatBtn">Repeat: Off</button>
      </div>
    </section>

    <section class="setup-card">
      <button id="connectBtn" class="primary">Connect to Google Drive</button>
      <input id="folderInput" placeholder="Paste Google Drive folder link here" />
      <button id="loadBtn" class="primary">Load Folder Playlist</button>
      <button id="refreshBtn">Refresh Playlist</button>
    </section>

    <section>
      <h2>Playlist</h2>
      <div id="playlist" class="playlist"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
