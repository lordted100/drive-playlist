<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drive Playlist</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<main class="app">
  <header><h1>Drive Playlist</h1><p>True shuffle and automatic Google reconnect.</p></header>
  <section class="card">
    <video id="player" controls playsinline preload="auto"></video>
    <h2 id="nowPlaying">Nothing loaded yet</h2>
    <p id="status">Starting…</p>
    <p id="bufferStatus"></p>
    <div class="grid"><button id="prevBtn">⏮ Previous</button><button id="nextBtn">Next ⏭</button></div>
    <div class="grid"><button id="shuffleBtn">True shuffle: Off</button><button id="repeatBtn">Repeat current: Off</button></div>
  </section>
  <section class="card">
    <button id="connectBtn" class="primary">Connect to Google Drive</button>
    <label class="remember-row"><input id="autoConnect" type="checkbox" checked><span>Automatically reconnect on this device</span></label>
    <input id="folderInput" placeholder="Paste Google Drive folder link here">
    <button id="loadBtn" class="primary">Load Folder Playlist</button>
  </section>
  <section class="card"><h2>Playlist</h2><div id="playlist"></div></section>
</main>
<script src="script.js"></script>
</body>
</html>
